<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fonts</title>
<!-- A tracked title in a family no machine has, so Chrome falls back to its serif font, a
     tracked card whose text is in a child, and a tracked box with no text. -->
<style>
  html, body { margin: 0; }
  #title { margin: 0; font: 40px 'Shaderera Missing Face', serif; }
  #card { font: 20px 'Shaderera Missing Face', serif; }
  #box { width: 40px; height: 40px; background: rgb(20, 30, 40); }
</style>
</head>
<body><h1 id="title">Hello</h1><div id="card"><span>Nested</span></div><div id="box"></div></body>
</html>
