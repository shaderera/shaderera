<!doctype html>
<!-- A square spun by CSS alone, for a frame that runs no script. -->
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #000 }
  div { width: 40px; height: 40px; margin: 10px; background: #fff; animation: spin 1s linear infinite }
  @keyframes spin { to { rotate: 1turn } }
</style>
<div></div>
