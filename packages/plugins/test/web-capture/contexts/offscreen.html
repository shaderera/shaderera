<!doctype html>
<!--
  An OffscreenCanvas handed to a worker, which draws it on its own animation frames: one grey,
  round(t / 10) % 256 at frame time t ms, and posts the grey back, which moves #drawn by it.
-->
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #000 }
  canvas { position: absolute; left: 0; top: 0; width: 40px; height: 40px }
  #drawn { position: absolute; left: 0; top: 60px; width: 10px; height: 10px; background: #fff }
</style>
<canvas id="canvas" width="40" height="40"></canvas>
<div id="drawn"></div>
<script>
  const source = `
    let ctx
    const draw = (t) => {
      const grey = Math.round(t / 10) % 256
      ctx.fillStyle = 'rgb(' + grey + ', ' + grey + ', ' + grey + ')'
      ctx.fillRect(0, 0, 40, 40)
      postMessage(grey)
      requestAnimationFrame(draw)
    }
    onmessage = ({ data }) => {
      ctx = data.getContext('2d')
      requestAnimationFrame(draw)
    }`
  const worker = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })))
  worker.onmessage = ({ data }) => {
    drawn.style.transform = `translate(${data}px, 0px)`
  }
  const offscreen = canvas.transferControlToOffscreen()
  worker.postMessage(offscreen, [offscreen])
</script>
