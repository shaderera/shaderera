<!doctype html>
<!--
  A page that reaches for this machine: a fetch to 127.0.0.1 and an image from localhost, on the
  port in its query (?port=…). A capture refuses both unless it is given --allow-local.
-->
<meta charset="utf-8" />
<style>
  body { margin: 0; background: #000 }
  #box { position: absolute; left: 20px; top: 20px; width: 40px; height: 40px; background: #fff }
</style>
<div id="box"></div>
<script>
  const port = new URLSearchParams(location.search).get('port')
  fetch(`http://127.0.0.1:${port}/secret`)
    .then((r) => r.text())
    .then((t) => { box.dataset.got = t })
    .catch(() => {})
  const img = new Image()
  img.src = `http://localhost:${port}/pixel`
  document.body.append(img)
</script>
